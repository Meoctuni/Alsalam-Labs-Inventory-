<!DOCTYPE html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Al Salam Hospitals - Lab Inventory</title>
<style>
:root{--bg:#f6f8fa;--c:#fff;--t:#16202a;--m:#667;--b:#dde3ea;--p:#0a857b;--n:#35238a;--r:#c0392b;--o:#d98a00;--g:#1e8a4c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#10161c;--c:#192129;--t:#e8eef3;--m:#9ab;--b:#2a343e;--p:#2fc0b2;--n:#a99bff;--c2:#fff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px system-ui,sans-serif}
header{background:#fff;color:#35238a;border-bottom:4px solid var(--p);padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}header h1{font-size:15px;margin:0;flex:1}
select,input,button{font:inherit;padding:8px;border:1px solid var(--b);border-radius:8px;background:var(--c);color:var(--t)}button{cursor:pointer}button.p{background:var(--p);color:#fff;border:0}h3,b{color:var(--n)}button.d{color:var(--r)}
main{padding:12px;max-width:900px;margin:auto}.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}.tabs button{white-space:nowrap}.tabs .on{background:var(--n);color:#fff;border-color:var(--n)}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:12px;margin:10px 0}.al{padding:8px 12px;border-radius:8px;margin:6px 0;color:#fff;font-size:14px}.red{background:var(--r)}.org{background:var(--o)}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.row>*{flex:1;min-width:90px}.lot{display:flex;justify-content:space-between;gap:6px;padding:6px 0;border-top:1px dashed var(--b);font-size:14px;align-items:center}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;color:#fff}.m{color:var(--m);font-size:13px}.bar{height:14px;background:var(--p);border-radius:4px}
dialog{border:1px solid var(--b);border-radius:12px;background:var(--c);color:var(--t);width:min(92vw,420px)}
@media print{header h1,#who{display:none}header{border:0}header,.tabs,.noprint,button{display:none!important}}
.sup,.iss,.adm{display:none}body.role-admin .sup,body.role-supervisor .sup,body.role-admin .iss,body.role-supervisor .iss,body.role-staff .iss{display:inline-block}body.role-admin .adm{display:inline-block}#auth{position:fixed;inset:0;background:var(--bg);z-index:9;display:flex;align-items:center;justify-content:center;padding:16px}#auth .card{width:min(92vw,380px);text-align:center}#auth input{width:100%;margin:5px 0}table{width:100%;border-collapse:collapse;font-size:13px;margin:6px 0}td,th{border:1px solid var(--b);padding:4px;text-align:start}.po{display:none}@media print{.po{display:block;text-align:center}body{background:#fff;color:#000}.card{border:0;padding:0}}</style><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0a857b"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"></head><body>

function tr(s){if(lang!=='en')return s;const t=s.trim();if(EX[t])return s.replace(t,EX[t]);for(const[a,b]of PAIRS)s=s.split(a).join(b);return s}
function walk(root){const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode()){if(/^(SCRIPT|STYLE)$/.test(n.parentNode.nodeName))continue;if(n._o===undefined)n._o=n.nodeValue;n.nodeValue=tr(n._o)}root.querySelectorAll('[placeholder]').forEach(e=>{if(e._p===undefined)e._p=e.placeholder;e.placeholder=tr(e._p)})}
function applyLang(){const h=document.documentElement;h.lang=lang;h.dir=lang==='en'?'ltr':'rtl';$('lg').textContent=lang==='en'?'العربية':'English';document.title=lang==='en'?'Al Salam Hospitals - Lab Inventory':'مستشفى السلام - مخزون المعمل';if(db&&window.items!==undefined)render();else walk(document.body)}

const days=d=>Math.floor((new Date(d)-new Date())/864e5),tot=i=>(i.lots||[]).reduce((a,l)=>a+(+l.qty||0),0),br=()=>$('branch').value;
$('branch').onchange=()=>{$('bn').textContent=br();render()};$('bn').textContent=br();
const CONF=(()=>{try{const l=JSON.parse(localStorage.getItem('cfg')||'null');if(l&&l.apiKey)return l}catch(e){}return CFG})();
const cfgOk=()=>CONF&&CONF.apiKey&&!/PASTE/.test(JSON.stringify(CONF));
let myName='';try{myName=localStorage.getItem('uname')||''}catch(e){}
function setWho(){$('who').textContent=myName}
function saveCfg(){const o={};String($('cf').value).replace(/(\w+)\s*:\s*["']([^"']+)["']/g,(m,k,v)=>{o[k]=v});if(!o.apiKey||!o.projectId){$('am').textContent='apiKey / projectId ?';return}try{localStorage.setItem('cfg',JSON.stringify(o))}catch(e){}location.reload()}
function init(){
 $('alogo').src=$('logo').src;
 if(!cfgOk()){$('auth').style.display='flex';return}
 firebase.initializeApp(CONF);db=firebase.firestore();db.enablePersistence({synchronizeTabs:true}).catch(()=>{});
 role='admin';document.body.className='role-admin';
 if(!myName){myName=(prompt(tr('اكتب اسمك (يظهر في سجل الحركات)'))||'').trim().slice(0,40);try{localStorage.setItem('uname',myName)}catch(e){}}
 email=myName;setWho();
 unsub.push(db.collection('items').onSnapshot(s=>{items=s.docs.map(d=>({id:d.id,...d.data()}));render();notify()},e=>{$('who').textContent=e.message}));
 unsub.push(db.collection('logs').orderBy('ts','desc').limit(1500).onSnapshot(s=>{logs=s.docs.map(d=>d.data());render()},e=>{}));
 prune();render()}
async function prune(){const c=new Date();c.setMonth(c.getMonth()-18);const old=await db.collection('logs').where('ts','<',c.toISOString()).limit(200).get();for(const d of old.docs)await d.ref.delete()}
function status(i){const out=[];for(const l of i.lots||[]){if(!+l.qty)continue;const d=days(l.exp);if(d<0)out.push(['red',`${i.name} (Lot ${l.lot}) منتهي الصلاحية!`]);else if(d<=(+i.warn||7))out.push(['org',`${i.name} (Lot ${l.lot}) ينتهي بعد ${d} يوم`])}
 if(tot(i)<=(+i.min||5))out.push(['org',`${i.name}: المخزون المتبقي ${tot(i)} فقط`]);return out}
let snd=false,AC=null,seen={},lastB=0;try{snd=localStorage.getItem('snd')==='1'}catch(e){}
const mkAC=()=>{try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}};
document.addEventListener('click',mkAC,{once:true});
function beep(){mkAC();if(!AC)return;[0,.35,.7].forEach((t,k)=>{const o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=k==2?1100:880;g.gain.value=.15;o.connect(g);g.connect(AC.destination);o.start(AC.currentTime+t);o.stop(AC.currentTime+t+.25)});try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
function updSnd(){$('snd').textContent=snd?'🔔':'🔕'}
function toggleSound(){snd=!snd;try{localStorage.setItem('snd',snd?'1':'0')}catch(e){}if(snd){if(window.Notification&&Notification.permission==='default')Notification.requestPermission();beep()}updSnd()}
function showN(body){if(!(window.Notification&&Notification.permission==='granted'))return;const o={body,icon:'icon-192.png',vibrate:[200,100,200],tag:'lab'},t=tr('تنبيه مخزون المعمل');try{navigator.serviceWorker.ready.then(g=>g.showNotification(t,o))}catch(e){try{new Notification(t,o)}catch(_){}}}
function notify(){if(!role||!items.length)return;const a=items.filter(i=>i.branch===br()).flatMap(status).map(x=>x[1]),fresh=a.filter(x=>!seen[x]);a.forEach(x=>seen[x]=1);if(a.length&&snd&&(fresh.length||Date.now()-lastB>18e5)){lastB=Date.now();beep();showN(a.length+tr(' تنبيه')+': '+a[0])}}
setInterval(notify,6e4);
function render(){render0();walk(document.body)}
function render0(){
 $('tabs').innerHTML=SECS.map(s=>`<button class="${s===sec?'on':''}" onclick="sec='${s}';render()">${s}</button>`).join('');
 const mine=items.filter(i=>i.branch===br());$('alerts').innerHTML=mine.flatMap(status).map(([c,t])=>`<div class="al ${c}">${esc(t)}</div>`).join('');
 const v=$('v');if(view==='stats')return stats(v);if(view==='report')return report(v);
 const list=mine.filter(i=>i.section===sec&&(!q||i.name.toLowerCase().includes(q)||(i.barcode||'')==q));
 if(!$('lst')){v.innerHTML=`<input class="noprint" style="width:100%" placeholder="بحث..." value="${esc(q)}" oninput="q=this.value.toLowerCase();render()"><div id="lst"></div>`}$('lst').innerHTML=(list.map(i=>`<div class="card"><div class="row"><b style="flex:3">${esc(i.name)}</b><span class="m">الإجمالي: ${tot(i)} ${esc(i.unit)}</span></div>
 ${(i.lots||[]).map((l,k)=>{const d=days(l.exp),c=d<0?'var(--r)':d<=(+i.warn||7)?'var(--o)':'var(--g)';return `<div class="lot"><span>Lot ${esc(l.lot)}<br><span class="tag" style="background:${c}">${esc(l.exp)}</span></span><span>${l.qty}</span><span class="noprint iss"><button onclick="use('${i.id}',${k})">صرف</button></span></div>`}).join('')}
 <div class="row noprint" style="margin-top:8px"><button class="iss" onclick="addLot('${i.id}')">+ Lot</button><button class="sup" onclick="openItem('${i.id}')">تعديل</button><button class="d adm" onclick="del('${i.id}')">حذف</button></div></div>`).join('')||'<p class="m">لا يوجد أصناف في هذا القسم.</p>');
}
function dlg(html){$('dlg').innerHTML=html;$('dlg').showModal();walk($('dlg'))}
function openItem(id){const i=items.find(x=>x.id===id)||{section:sec,unit:'',min:5,warn:7,lots:[]};
 dlg(`<div class="row" style="flex-direction:column;align-items:stretch"><b>${id?'تعديل':'صنف جديد'}</b><input id="n" placeholder="الاسم" value="${esc(i.name)}"><select id="s">${SECS.map(s=>`<option ${s===i.section?'selected':''}>${s}</option>`).join('')}</select><input id="u" placeholder="الوحدة (kit, box...)" value="${esc(i.unit)}"><input id="bc" placeholder="باركود" value="${esc(i.barcode)}"><label>تنبيه لما الكمية ≤ <input id="mn" type="number" value="${i.min}"></label><label>تنبيه قبل الانتهاء (يوم) <input id="w" type="number" value="${i.warn}"></label>
 ${id?'':'<input id="l" placeholder="Lot number"><input id="e" type="date"><input id="qt" type="number" placeholder="الكمية">'}<button class="p" onclick="saveItem('${id||''}')">حفظ</button><button onclick="$('dlg').close()">إلغاء</button></div>`)}
async function saveItem(id){const o={name:$('n').value.trim(),section:$('s').value,unit:$('u').value,barcode:$('bc').value.trim(),min:+$('mn').value,warn:+$('w').value,branch:br()};if(!o.name)return;
 if(id)await db.collection('items').doc(id).update(o);else{o.lots=$('l')&&$('l').value?[{lot:$('l').value,exp:$('e').value,qty:+$('qt').value||0}]:[];const r=await db.collection('items').add(o);if(o.lots.length)lg(r.id,o,o.lots[0].lot,o.lots[0].qty)}$('dlg').close()}
function addLot(id){dlg(`<div class="row" style="flex-direction:column;align-items:stretch"><b>إضافة Lot / استلام</b><input id="l" placeholder="Lot number"><input id="e" type="date"><input id="qt" type="number" placeholder="الكمية المستلمة"><button class="p" onclick="saveLot('${id}')">حفظ</button><button onclick="$('dlg').close()">إلغاء</button></div>`)}
async function saveLot(id){const i=items.find(x=>x.id===id),lots=[...(i.lots||[])],n=$('l').value.trim(),qt=+$('qt').value||0,x=lots.find(l=>l.lot===n);if(!n)return;if(x)x.qty=(+x.qty||0)+qt;else lots.push({lot:n,exp:$('e').value,qty:qt});await db.collection('items').doc(id).update({lots});lg(id,i,n,qt);$('dlg').close()}
function use(id,k){dlg(`<div class="row" style="flex-direction:column;align-items:stretch"><b>صرف كمية</b><input id="qt" type="number" placeholder="الكمية" autofocus><button class="p" onclick="doUse('${id}',${k})">تأكيد</button><button onclick="$('dlg').close()">إلغاء</button></div>`)}
async function doUse(id,k){const i=items.find(x=>x.id===id),lots=JSON.parse(JSON.stringify(i.lots)),n=Math.min(+$('qt').value||0,+lots[k].qty);if(n<=0)return;lots[k].qty-=n;await db.collection('items').doc(id).update({lots});lg(id,i,lots[k].lot,-n);$('dlg').close()}
async function del(id){if(confirm(tr('حذف الصنف؟')))await db.collection('items').doc(id).delete()}
function lg(id,i,lot,delta){db.collection('logs').add({ts:new Date().toISOString(),item:id,name:i.name,section:i.section,branch:i.branch||br(),lot,delta,by:email||me})}
let stream,timer;async function scan(){$('vid').showModal();if(!('BarcodeDetector' in window)){return}try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});cam.srcObject=stream;cam.play();const bd=new BarcodeDetector();timer=setInterval(async()=>{try{const r=await bd.detect(cam);if(r[0])found(r[0].rawValue)}catch(e){}},500)}catch(e){}}
function stopCam(){clearInterval(timer);stream&&stream.getTracks().forEach(t=>t.stop());$('vid').close()}
function found(c){stopCam();c=String(c).trim();const i=items.find(x=>x.barcode===c);if(i){sec=i.section;q='';render();addLot(i.id)}else{openItem();setTimeout(()=>{$('bc').value=c},50)}}
let rtab='mov',rf=new Date(Date.now()-90*864e5).toISOString().slice(0,10),rto=new Date().toISOString().slice(0,10);
const logsR=()=>logs.filter(l=>l.branch===br()&&l.ts.slice(0,10)>=rf&&l.ts.slice(0,10)<=rto);
function statsHtml(){const L=logs.filter(l=>l.branch===br()),M={},S={},T={};
 L.forEach(l=>{const k=l.ts.slice(0,7),m=M[k]||(M[k]={i:0,o:0});if(l.delta>0)m.i+=l.delta;else{m.o-=l.delta;S[l.section]=(S[l.section]||0)-l.delta;T[l.name]=(T[l.name]||0)-l.delta}});
 const ks=Object.keys(M).sort().slice(-18),mx=Math.max(1,...ks.map(k=>M[k].o)),g=ks.length>1&&M[ks[ks.length-2]].o?Math.round((M[ks[ks.length-1]].o-M[ks[ks.length-2]].o)/M[ks[ks.length-2]].o*100):0;
 const mine=items.filter(i=>i.branch===br()),ex=mine.flatMap(i=>(i.lots||[]).filter(l=>+l.qty&&days(l.exp)<0).map(l=>({n:i.name,l:l.lot,e:l.exp,q:l.qty}))),soon=mine.flatMap(i=>(i.lots||[]).filter(l=>+l.qty&&days(l.exp)>=0&&days(l.exp)<=30)).length;
 const top=Object.entries(T).sort((a,b)=>b[1]-a[1]).slice(0,10);
 return `<b>الاستهلاك الشهري</b><table><tr><th>الشهر<th>المستلم<th>المصروف<th>الصافي<th style="width:35%"></tr>${ks.map(k=>`<tr><td>${k}<td>${M[k].i}<td>${M[k].o}<td>${M[k].i-M[k].o}<td><div class="bar" style="width:${M[k].o/mx*100}%"></div></tr>`).join('')||'<tr><td colspan=5>لا توجد بيانات بعد</tr>'}</table><p>التغير عن الشهر السابق: ${g>0?'+':''}${g}%</p>
 <b>الاستهلاك حسب القسم</b><table>${Object.entries(S).map(([k,x])=>`<tr><td>${esc(k)}<td>${x}</tr>`).join('')}</table><b>الأكثر استهلاكا</b><table>${top.map(([k,x])=>`<tr><td>${esc(k)}<td>${x}</tr>`).join('')}</table>
 <p>منتهي الصلاحية حاليا: ${ex.reduce((a,x)=>a+ +x.q,0)} وحدة في ${ex.length} Lot</p><p>تنتهي خلال 30 يوم: ${soon} Lot</p>`}
function stockHtml(){return SECS.map(s=>{const L=items.filter(i=>i.branch===br()&&i.section===s);if(!L.length)return'';return `<b>${s}</b><table><tr><th>الصنف<th>الدفعة<th>تاريخ الانتهاء<th>الكمية<th>الحالة</tr>`+L.map(i=>(i.lots||[]).length?i.lots.map(l=>{const d=days(l.exp);return `<tr><td>${esc(i.name)}<td>${esc(l.lot)}<td>${esc(l.exp)}<td>${l.qty} ${esc(i.unit)}<td>${d<0?'منتهي':d<=(+i.warn||7)?'قريب الانتهاء':'سليم'}</tr>`}).join(''):`<tr><td>${esc(i.name)}<td><td><td>0<td></tr>`).join('')+'</table>'}).join('')||'<p class="m">-</p>'}

function report(v){const tb=(k,t)=>`<button class="${rtab===k?'on':''}" onclick="rtab='${k}';render()">${t}</button>`;
 v.innerHTML=`<div class="tabs noprint">${tb('mov','حركات')}${tb('stock','المخزون الحالي')}${tb('st','إحصائيات')}</div><div class="card"><div class="row noprint">${rtab==='mov'?`<label>من <input id="f" type="date" value="${rf}" onchange="rp()"></label><label>إلى <input id="t" type="date" value="${rto}" onchange="rp()"></label>`:''}<button class="p" onclick="print()">طباعة</button>${rtab==='mov'?'<button onclick="csv()">تصدير CSV</button>':''}</div><p class="m">يتم الاحتفاظ بالسجلات 18 شهر</p><div id="rt"></div></div>`;rp()}
function rp(){if($('f')){rf=$('f').value||rf;rto=$('t').value||rto}let h;
 if(rtab==='st')h=statsHtml();else if(rtab==='stock')h=stockHtml();else{const L=logsR(),S={};L.forEach(l=>{const o=S[l.section]||(S[l.section]={i:0,o:0});l.delta>0?o.i+=l.delta:o.o-=l.delta});
  const tin=L.filter(l=>l.delta>0).reduce((a,l)=>a+l.delta,0),tout=L.filter(l=>l.delta<0).reduce((a,l)=>a-l.delta,0),ex=items.filter(i=>i.branch===br()).flatMap(i=>(i.lots||[]).filter(l=>+l.qty&&days(l.exp)<0));
  h=`<b>ملخص الفترة</b><table><tr><th>القسم<th>وارد<th>مصروف</tr>${Object.entries(S).map(([k,o])=>`<tr><td>${esc(k)}<td>${o.i}<td>${o.o}</tr>`).join('')}<tr><th>الإجمالي<th>${tin}<th>${tout}</tr></table><p>Lots منتهية حاليا: ${ex.length} | نسبة الصرف للوارد: ${tin?Math.round(tout/tin*100):0}%</p><table><tr><th>التاريخ<th>القسم<th>الصنف<th>Lot<th>الحركة<th>بواسطة</tr>${L.map(l=>`<tr><td>${l.ts.slice(0,10)}<td>${esc(l.section)}<td>${esc(l.name)}<td>${esc(l.lot)}<td>${l.delta>0?'+':''}${l.delta}<td>${esc(l.by||'')}</tr>`).join('')}</table>`}
 $('rt').innerHTML=h;walk($('v'))}
function csv(){const q=x=>'"'+String(typeof x==='string'&&/^[=+\-@]/.test(x)?"'"+x:x).replace(/"/g,'""')+'"';const rows=[['Date','Section','Item','Lot','Movement','By']].concat(logsR().map(l=>[l.ts.slice(0,10),l.section,l.name,l.lot,l.delta,l.by||'']));const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv'}));a.download='lab-log-'+rf+'_'+rto+'.csv';a.click()}

updSnd();init();applyLang();if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
